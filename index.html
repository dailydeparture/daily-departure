*{box-sizing:border-box}
html,body{margin:0;background:#0c1320;color:#e8eef7;font-family:'B612',system-ui,sans-serif;font-size:15px;line-height:1.35}
#app{max-width:440px;margin:0 auto;padding:12px 12px 24px;display:flex;flex-direction:column;gap:10px}
.mono,.lbl,.key,.pill,.tag,.status,footer{font-family:'B612 Mono',monospace}
header{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.logo{font-family:'B612 Mono',monospace;font-weight:700;font-size:15px;letter-spacing:2px;color:#4fd1ff;text-decoration:none}
.pill{font-size:11px;padding:3px 7px;border:1px solid transparent;border-radius:3px;transition:transform .2s}
.pill.amber{color:#ffb020;border-color:#ffb020}.pill.green{color:#3ddc84}
.screen{position:relative;border:1px solid #26354f;border-radius:6px;overflow:hidden;line-height:0;background:#000}
canvas{width:100%;height:auto;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.tag{position:absolute;left:8px;top:8px;line-height:1;font-size:11px;color:#3ddc84;background:rgba(7,11,20,.85);padding:4px 6px;border-radius:3px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-family:'B612 Mono',monospace;font-size:11px;text-align:center;line-height:1.3}
.strip div{border-top:3px solid #26354f;padding-top:4px}
.card{border:1px solid #26354f;border-radius:6px;background:#121b2c;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.lbl{font-size:11px;color:#4fd1ff;letter-spacing:.5px}
.tagline{margin:0 4px;font-size:16px}
.step{display:flex;gap:12px}.step b{display:block;font-size:15px}.step small{display:block;font-size:13px;color:#a3b2c8;margin-top:2px}
.num{flex:none;width:26px;height:26px;border:1px solid #4fd1ff;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'B612 Mono',monospace;color:#4fd1ff}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;margin-top:6px;font-family:'B612 Mono',monospace;font-size:8px;text-align:center}
.ladder div{border-bottom:3px solid;padding-bottom:3px}
.dots{color:#33405a}
.key{appearance:none;background:#1a2232;border:1px solid #33405a;border-radius:4px;color:#e8eef7;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;flex-direction:column;min-height:48px;padding:6px 10px}
.key{transition:transform .06s,box-shadow .06s,filter .06s;box-shadow:0 3px 0 #0a0f19}
.key:active,.key.pressed{transform:translateY(2px);box-shadow:0 1px 0 #0a0f19;filter:brightness(.92)}
.key.enter{background:#2c8f5c;border-color:#4fd08c;color:#0c1320;box-shadow:0 3px 0 #1d5e3d}
.key.enter:active,.key.enter.pressed{box-shadow:0 1px 0 #1d5e3d,0 0 14px 2px rgba(79,208,140,.55)}
.key.enter .bar{display:none}
.key .bar{display:block;width:34px;height:3px;border-radius:2px;background:#3d4a63}.bar.g{background:#3ddc84}.bar.c{background:#4fd1ff}
.key.big{flex-direction:row;justify-content:space-between;min-height:60px;padding:0 16px;font-size:16px;letter-spacing:1px;width:100%}
.key.big .bar{width:4px;height:32px}
.key.big .kl{flex:1;text-align:left;margin-left:12px;display:flex;flex-direction:column;gap:3px}.key.big small{font-size:11px;font-weight:400;color:#8193ad;letter-spacing:0}
.chev{color:#3ddc84;font-size:20px}
.key.sm{min-height:44px;font-size:11px;font-weight:400;color:#a3b2c8;flex:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-family:'B612 Mono',monospace;text-align:center}
.stats>*{border:1px solid #26354f;border-radius:4px;padding:8px 0;background:transparent;color:#e8eef7;font-family:inherit;display:flex;flex-direction:column;gap:2px;cursor:default}
.stats button{cursor:pointer;background:#121b2c}.stats span{font-size:11px;color:#4fd1ff}.stats b{font-size:15px;font-weight:400}
.test{margin-top:6px;display:flex;flex-direction:column;gap:6px}.row{display:flex;gap:6px}
.mcdu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));row-gap:8px;column-gap:12px}.mcdu span{display:block;font-size:11px;color:#4fd1ff}.mcdu b{font-size:16px;color:#3ddc84;font-weight:400}.mcdu .r{text-align:right}
.note{border-top:1px dashed #26354f;padding-top:8px;font-size:11px;color:#a3b2c8;line-height:1.6}
.hangar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.liv{min-height:52px;background:#121b2c;border:1px solid #33405a;border-radius:4px;color:#e8eef7;font-family:'B612 Mono',monospace;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px;cursor:pointer}
.liv.on{border-color:#3ddc84}.liv.lock{border-style:dashed;color:#8193ad;cursor:default}
.key.big.go{background:linear-gradient(180deg,#123a26,#0c2a1b);border-color:#3ddc84;color:#eafff2;box-shadow:0 0 14px rgba(61,220,132,.25)}
.key.big.go small{color:#3ddc84;font-size:11px;letter-spacing:1.5px}
.key.big.go .chev{color:#3ddc84}
.liv.lock{cursor:pointer}
.lpop{position:fixed;inset:0;background:rgba(3,7,14,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.popc{background:#121b2c;border:1px solid #4fd1ff;border-radius:8px;padding:16px;width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px;text-align:center}
.popsw{height:22px;border-radius:3px;border-bottom:5px solid;filter:grayscale(.35) brightness(.8)}
.popn{font-size:15px;color:#e8eef7;letter-spacing:1px}
.poph{display:flex;flex-direction:column;gap:4px;font-size:11px;color:#a3b2c8}.poph b{font-size:13px;color:#ffb020;line-height:1.4}
.liv small{font-size:8px;color:#8193ad;text-align:center}
.sw{display:block;width:40px;height:9px;border-bottom:3px solid}
.qhead{display:flex;justify-content:space-between;align-items:baseline}#secs{font-size:20px}
.timer{position:relative;height:12px;background:#172236;border-radius:2px;overflow:hidden}#bar{position:absolute;left:0;top:0;bottom:0;width:100%;background:#3ddc84}
.ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 11px,#121b2c 11px 12px)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:#8193ad;margin-top:-5px}
.prompt{margin:4px 0 0;font-size:24px;line-height:1.15}.hint{margin:0;font-size:13px;color:#a3b2c8}
.ansrow{display:flex;gap:8px}
#ans{flex:1;min-width:0;height:52px;background:#050810;border:1px solid #4fd1ff;border-radius:4px;color:#3ddc84;font-family:'B612 Mono',monospace;font-size:21px;padding:0 12px;outline:none}
#ans.warn{border-color:#ffb020;color:#ffb020}
.key.enter{width:88px;flex:none}
.hintline{font-size:11px;color:#8193ad;margin:0}
.caution{border:1px solid #ffb020;border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:7px;background:rgba(255,176,32,.06);color:#e8eef7;font-size:13px}
.caution b{font-family:'B612 Mono',monospace;color:#ffb020;font-size:12px}
.key.sug{flex-direction:row;justify-content:space-between;min-height:44px;font-size:13px}.sel{color:#4fd1ff;font-weight:400}
.qsmall{margin:0;font-size:13px;color:#a3b2c8}.answer{font-size:23px;font-weight:700}.typed{font-size:13px;font-weight:400;color:#a3b2c8}
.cabins{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;align-items:end;font-family:'B612 Mono',monospace;text-align:center}
.cabins div{height:32px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border-radius:3px;background:#172236;color:#8193ad;border:1px dashed #33405a;transition:background .15s}
.cabins div.land{height:44px;font-size:12px;box-shadow:0 0 0 2px #121b2c,0 0 0 4px currentColor;border:0;color:#0c1320!important}
.cabins.you span{font-size:11px;color:#ffb020;font-weight:700}
.reveal{opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s;display:flex;flex-direction:column;gap:6px}.reveal.show{opacity:1;transform:none}
.tierline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.tiername{font-family:'B612 Mono',monospace;font-size:28px;font-weight:700;letter-spacing:2px}.pct{font-size:11px;color:#a3b2c8}
.status{font-size:12px;border-top:1px dashed #26354f;padding-top:8px}.quip{margin:0;font-size:16px}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.25)}100%{transform:scale(1)}}.pop{animation:pop .5s}
.fly{position:fixed;z-index:9;font-family:'B612 Mono',monospace;font-weight:700;font-size:20px;pointer-events:none;transition:transform .85s cubic-bezier(.45,-0.35,.6,1),opacity .85s;text-shadow:0 0 6px #0c1320}
.unlock{border-color:#ff4fd8;background:#120a18}.unl{display:flex;align-items:center;gap:12px}
.seatmap{position:relative;height:66px}
.col i.pax{background:#4fd1ff;opacity:0;animation:fillin .25s forwards}
@keyframes fillin{from{opacity:0;transform:scale(.4)}to{opacity:.85;transform:scale(1)}}
.smkey{display:flex;gap:14px;font-size:11px;color:#a3b2c8;margin-top:4px}
.smkey .k{display:inline-block;width:8px;height:8px;border-radius:1px;background:#3d4a63;margin-right:5px;vertical-align:-1px}
.smkey .k.pax{background:#4fd1ff}
.hull{position:absolute;left:0;right:14px;top:8px;bottom:8px;background:#1a2436;border-radius:6px 26px 26px 6px}
.loo{position:absolute;left:4px;top:25px;width:12px;height:16px;background:#33405a;border-radius:2px}.deck{position:absolute;right:16px;top:22px;display:flex;flex-direction:column;gap:2px}.deck i{display:block;width:10px;height:9px;background:#33405a;border-radius:2px}
.seats{position:absolute;left:22px;right:36px;top:11px;bottom:11px;display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:2px}
.col{display:grid;grid-template-rows:repeat(7,minmax(0,1fr));gap:1px}.col i{display:block;background:#3d4a63;border-radius:1px}.col i:nth-child(4){background:transparent}
.seatmap .me,.deck i.me{background:#ffb020!important;box-shadow:0 0 0 2px #ffe08a;animation:blink .8s infinite}
@keyframes blink{50%{opacity:.35}}
.smlab{display:flex;justify-content:space-between;font-size:11px;color:#8193ad}
.log{font-size:11px;line-height:1.75;gap:0}.loghead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}.big.amber{color:#ffb020;font-size:20px;font-weight:700}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

let AC=null,MUTE=false,NB=null;try{MUTE=localStorage.getItem('dd-mute')==='1'}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();if(typeof loadSamples==='function')loadSamples();return AC}
function tone(f,d,o={}){const c=ac();if(!c||MUTE)return;const {type='square',vol=0.06,at=0,to=null}=o;const t0=c.currentTime+at;const os=c.createOscillator(),g=c.createGain();os.type=type;os.frequency.setValueAtTime(f,t0);if(to)os.frequency.exponentialRampToValueAtTime(to,t0+d);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);os.connect(g);g.connect(c.destination);os.start(t0);os.stop(t0+d+0.02)}
function noise(d,o={}){const c=ac();if(!c||MUTE)return;const {vol=0.08,at=0,f=800,f2=null,q=0.7,attack=0.01}=o;if(!NB){NB=c.createBuffer(1,c.sampleRate*2,c.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
  const t0=c.currentTime+at;const s=c.createBufferSource();s.buffer=NB;s.loop=true;const bf=c.createBiquadFilter();bf.type='lowpass';bf.frequency.setValueAtTime(f,t0);if(f2)bf.frequency.exponentialRampToValueAtTime(f2,t0+d);bf.Q.value=q;
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+attack);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);s.connect(bf);bf.connect(g);g.connect(c.destination);s.start(t0);s.stop(t0+d+0.05)}

  if(!b||!b.top){box.remove();return}
  const me=b.me,rows=b.top.map(r=>`<div class="lbrow${r.me?' me':''}"><span class="lbrank">${r.rank}</span><span class="lbname">${esc(r.name)}${r.me?' <small>YOU</small>':''}</span><span class="lbtiers">${(r.tiers||[]).map(t=>`<i style="background:${t?TIER_COL[t]:'#26354f'}"></i>`).join('')}</span><span class="lbscore">${r.score}</span></div>`).join('');
  const extra=me&&me.rn>10?`<div class="lbgap">⋮</div><div class="lbrow me"><span class="lbrank">${me.rank}</span><span class="lbname">${esc(me.name)} <small>YOU</small></span><span class="lbtiers">${st.res.map(r=>`<i style="background:${r.tier?TIER_COL[r.tier]:'#26354f'}"></i>`).join('')}</span><span class="lbscore">${me.score}</span></div>`:'';
  const sum=me?`You're <b>#${me.rank}</b> of ${b.total} flyer${b.total===1?'':'s'} today${b.total>1?`, ahead of ${Math.round(100*me.beat/(b.total-1))}% of the others`:''}.`:`${b.total} flyer${b.total===1?'':'s'} so far today.`;
  const nm='';
  const ask=getName()?'':`<form class="lbname-ask" id="lbf" autocomplete="off"><b>Add your name to today's board</b><span>You're showing as Anonymous flyer.</span><div class="nmline"><input id="lbn" maxlength="16" placeholder="First name or nickname" autocapitalize="words" spellcheck="false" enterkeyhint="done" aria-label="Your name"><button class="namebtn">ADD</button></div><div id="lberr" class="nmerr" aria-live="polite"></div></form>`;
  box.innerHTML=`<div class="lbl">TODAY'S LEADERBOARD</div>${ask}<p class="lbsum">${sum}</p>${rows||'<div class="muted">No scores yet.</div>'}${extra}`;
  const f=$('lbf');if(f)f.onsubmit=async e=>{e.preventDefault();const r=cleanName($('lbn').value);if(r.err){$('lberr').textContent=r.err;return}
    try{localStorage.setItem('dd-name',r.v)}catch(e){}$('lberr').textContent='Saving…';await dbSetName(day,r.v);loadBoard()}}
function planeMap(rank){const seat=seatOf(rank);const W=362,H=190,cy=95,half=26,cols=24,x1=292,pitch=(x1-22)/cols;let p='';
  p+=`<path d="M175 ${cy-half} L120 8 L140 8 L215 ${cy-half} Z" fill="#1a2538" stroke="#3a4d6e"/><path d="M175 ${cy+half} L120 ${H-8} L140 ${H-8} L215 ${cy+half} Z" fill="#1a2538" stroke="#3a4d6e"/>`;
  p+=`<path d="M30 ${cy-14} L8 ${cy-48} L20 ${cy-48} L52 ${cy-14} Z" fill="#1a2538" stroke="#3a4d6e"/><path d="M30 ${cy+14} L8 ${cy+48} L20 ${cy+48} L52 ${cy+14} Z" fill="#1a2538" stroke="#3a4d6e"/>`;
  p+=`<rect x="150" y="${cy-56}" width="22" height="10" rx="5" fill="#22304a" stroke="#3a4d6e"/><rect x="150" y="${cy+46}" width="22" height="10" rx="5" fill="#22304a" stroke="#3a4d6e"/>`;
  p+=`<path d="M14 ${cy} Q22 ${cy-half} 56 ${cy-half} L300 ${cy-half} Q352 ${cy-half} 356 ${cy} Q352 ${cy+half} 300 ${cy+half} L56 ${cy+half} Q22 ${cy+half} 14 ${cy} Z" fill="#121b2c" stroke="${seat.deck?'#f0b44a':'#4a6188'}" stroke-width="2"/>`;
  p+=`<path d="M330 ${cy-10} Q344 ${cy-8} 346 ${cy} Q344 ${cy+8} 330 ${cy+10}" fill="none" stroke="${seat.deck?'#f0b44a':'#62c6ee'}" stroke-width="3" stroke-linecap="round"/>`;
  const ys=[cy-21,cy-14,cy-7,cy+4,cy+11,cy+18];
  for(let row=1;row<=cols;row++){const x=x1-row*pitch+2;ys.forEach((y,s)=>{const idx=(row-1)*6+s;const me=seat.idx===idx;const beat=seat.deck||(!seat.loo&&idx>seat.idx);const n=143-idx;
    p+=`<rect class="${beat&&!me?'pax':''}" x="${x.toFixed(1)}" y="${y}" width="${(pitch-2).toFixed(1)}" height="5" rx="1.5" fill="${me?'#f0b44a':beat?'#62c6ee':'#22304a'}"${beat&&!me?` style="animation-delay:${Math.min(n*12,1600)}ms"`:''}/>`})}
  if(seat.loo)p+=`<rect x="22" y="${cy-9}" width="14" height="18" rx="3" fill="#f0b44a"/>`;
  return `<svg class="plane" viewBox="0 0 ${W} ${H}" role="img" aria-label="Seat map: ${seat.label}">${p}</svg><div class="smlab mono"><span>‹ BACK</span><span>FLIGHT DECK ›</span></div><div class="smkey mono"><span><i class="k" style="background:#f0b44a"></i>YOU</span><span><i class="k pax"></i>FLYERS BEHIND YOU</span></div>`}
function seatMap(rank){const seat=seatOf(rank);let cols='';
  for(let row=24;row>=1;row--){let c='';for(const L of 'FED_CBA'){if(L==='_'){c+='<i></i>';continue}const idx=(row-1)*6+'ABCDEF'.indexOf(L);const beat=seat.deck||(!seat.loo&&idx>seat.idx);const n=143-idx;c+=`<i class="${seat.idx===idx?'me':beat?'pax':''}"${beat?` style="animation-delay:${Math.min(n*12,1600)}ms"`:''}></i>`}cols+=`<div class="col">${c}</div>`}
  return `<div class="seatmap"><div class="hull"></div><div class="loo ${seat.loo?'me':''}"></div><div class="deck ${seat.deck?'me':''}"><i></i><i></i></div><div class="seats">${cols}</div></div><div class="smkey mono"><span><i class="k pax"></i>FLYERS BEHIND YOU</span><span><i class="k"></i>FLYERS AHEAD</span></div><div class="smlab mono"><span>LOO</span><span>FRONT ›</span><span>FLIGHT DECK</span></div>`}
function end(){view='end';clearReveal();setScene(6,st.res[6]?st.res[6].tier:0,false,1);tag('CHOCKS ON · STAND 512');st.i=7;stripUI();const p=score();hdr('SCORE '+p,'amber');
  const rank=rankOf(p),seat=seatOf(rank),pr=Math.round(pctOf(p)*100);
  const shareBase=`Daily Departure ${PRACTICE?'bonus flight':'#'+DAY} ✈️\n${st.res.map(r=>TIER_EMO[r.tier]).join('')}\n`;window.ddShare=shareBase+`Score ${p}`;window.ddShareFor=pos=>shareBase+`${pos} · Score ${p}`;const share=window.ddShare;
  const nu=(st.newUn||[]).map(livById);
  panel.innerHTML=`${nu.length?`<div class="card unlock">${nu.map(L=>`<div class="unl"><span class="sw" style="background:linear-gradient(90deg,${L.tail} 32%,${L.body||'#f1f3f7'} 32%);border-bottom-color:${L.acc}"></span><div class="mono"><div style="font-size:11px;color:#ff4fd8">★ RARE REWARD · LIVERY UNLOCKED</div><div>${L.name.toUpperCase()}</div></div></div>`).join('')}</div>`:''}
  <div class="card"><div class="lbl">${PRACTICE?'BONUS FLIGHT · WHERE YOU WOULD HAVE SAT':'WHERE YOU SAT TODAY'}</div>${planeMap(rank)}<div class="mono" style="font-size:18px;color:#ffb020;font-weight:700;margin-top:6px">${seat.label}</div><div>Ahead of about ${pr}% of flyers <small class="muted">(estimated until real scores come in)</small></div></div>
  ${PRACTICE?'':'<div class="card" id="lb"><div class="lbl">TODAY\'S LEADERBOARD</div><div class="muted lbload">Checking in with the tower…</div></div>'}
  <div class="card mono log"><div class="loghead"><span class="lbl">FLIGHT LOG · KS${100+DAY}</span><span class="big amber">SCORE ${p}</span></div>
   <div class="chips">${[5,4,3,2,1].map(k=>{const n=st.res.filter(r=>r.tier===k).length;return n?`<span style="background:${TIER_COL[k]}">${n} ${TIER_NAME[k]}</span>`:''}).join('')}</div>
   ${STAGES.map((s,i)=>{const r=st.res[i];return `<div style="display:flex;justify-content:space-between;gap:8px"><span><span style="color:#62c6ee">${s.name}</span> · ${r.name?esc(r.name):'timed out'}</span><span style="color:${r.tier?TIER_COL[r.tier]:'#8193ad'};white-space:nowrap">${r.tier?TIER_NAME[r.tier]:'NO SEAT'}</span></div>`}).join('')}</div>
  <div class="row3 two"><button class="key" id="cp"><span class="bar c"></span>SHARE</button><button class="key" id="rv2"><span class="bar"></span>ANSWERS</button></div>
  <p id="cpm" class="mono hintline"></p><pre id="sh" class="share">${esc(share)}</pre>
  <div id="answers" style="display:none">${Q.map((q,i)=>{const r=st.res[i];const top=[...q.list].sort((x,y)=>y.tier-x.tier).slice(0,8);
    return `<details class="card"><summary>Q${i+1} ${esc(q.prompt)} <span style="color:${TIER_COL[r.tier]}">· ${r.name?esc(r.name):'timed out'}</span></summary><p class="muted">${q.list.length} answers on file. Tap a cabin to see what lands there.</p><div class="tabs" data-q="${i}">${[1,2,3,4,5].map(k=>`<button type="button" class="tab${k===(r.tier||1)?' on':''}" data-k="${k}" style="--c:${TIER_COL[k]}">${TIER_SHORT[k]}</button>`).join('')}</div><div class="tablist" id="tl${i}">${tierList(q,r,r.tier||1)}</div></details>`}).join('')}
   ${TEST?'<button class="key sm" id="rp" style="margin-top:8px">REPLAY THIS FLIGHT (TEST)</button>':''}</div>`;
  if(nu.length){SFX.unlock(0.3);st.newUn=[];save()}
  $('cp').onclick=async()=>{try{if(navigator.share){await navigator.share({text:window.ddShare});$('cpm').textContent='SHARED';return}}catch(e){if(e&&e.name==='AbortError')return}try{await navigator.clipboard.writeText(window.ddShare);$('cpm').textContent='COPIED TO CLIPBOARD'}catch(e){const rg=document.createRange();rg.selectNodeContents($('sh'));const sl=getSelection();sl.removeAllRanges();sl.addRange(rg);$('cpm').textContent='SELECTED. COPY IT FROM BELOW'}};
  if($('nf'))$('nf').onclick=()=>startBonus();if(!PRACTICE)loadBoard();
  document.querySelectorAll('.tabs').forEach(t=>t.onclick=ev=>{const b=ev.target.closest('.tab');if(!b)return;const i=+t.dataset.q;t.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));$('tl'+i).innerHTML=tierList(Q[i],st.res[i],+b.dataset.k)});
  $('rv2').onclick=()=>{const a=$('answers');a.style.display=a.style.display==='none'?'block':'none'};
  if($('rp'))$('rp').onclick=()=>{if(!PRACTICE)try{localStorage.removeItem(key())}catch(e){}startFlight()}}

// ================= wiring =================
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!$('nx')||document.activeElement.id==='ans')return;e.preventDefault();if(revealDone)$('nx').click();else if(skipReveal)skipReveal()});
$('home').onclick=e=>{e.preventDefault();clearInterval(timer);clearReveal();load();wipe(home)};
function sndBtn(){const b=$('snd');b.textContent=MUTE?'SND OFF':'SND ON';b.style.color=MUTE?'#8193ad':'#3ddc84';b.onclick=()=>{MUTE=!MUTE;try{localStorage.setItem('dd-mute',MUTE?'1':'0')}catch(e){}sndBtn();if(!MUTE)SFX.board()}}
sprites();sndBtn();load();home();requestAnimationFrame(frame);

function livPop(id){const L=livById(id);SFX.whoosh();const o=document.createElement('div');o.className='lpop';
 o.innerHTML=`<div class="popc mono"><div class="lbl">LOCKED LIVERY</div><div class="popsw" style="background:linear-gradient(90deg,${L.tail} 32%,${L.body||'#f1f3f7'} 32%);border-bottom-color:${L.acc}"></div><div class="popn">${esc(L.name.toUpperCase())}</div><div class="poph"><span>UNLOCK WHEN YOU</span><b>${esc(L.how.toUpperCase())}</b></div><button class="key sm" id="popx">CLOSE</button></div>`;
 document.body.appendChild(o);const close=()=>{o.remove();document.removeEventListener('keydown',k)};const k=e=>{if(e.key==='Escape'||e.key==='Enter'){e.preventDefault();e.stopImmediatePropagation();close()}};
 document.addEventListener('keydown',k,true);o.onclick=e=>{if(e.target===o)close()};o.querySelector('#popx').onclick=close}


</script>
